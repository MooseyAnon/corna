log_format log_with_timings '[$time_local] $remote_addr '
                            'host="$host" '
                            '"$request" $status $body_bytes_sent '
                            'request_time=$request_time '
                            'upstream_status=$upstream_status '
                            'upstream_time=$upstream_response_time '
                            'request_id=$request_id '
                            'user_agent="$http_user_agent"';

# from: https://stackoverflow.com/a/29113949
map $http_origin $cors_header {
    default "https://testingcorna.test";
    "~^https?://[^/]+\.testingcorna\.test(:[0-9]+)?$" "$http_origin";
}

server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    server_name ~^api.testingcorna.test;

    access_log /dev/stdout log_with_timings;
    error_log stderr warn;

    # nginx was return 413 errors for relatively small files
    # from: https://stackoverflow.com/a/45694779
    client_max_body_size 20M;

    # nginx was writing to a temp file while uploading image
    # from: https://serverfault.com/q/511789
    client_body_buffer_size 20M;

    location / {
        resolver 127.0.0.11;
        proxy_pass http://corna:5001/api$request_uri;
        proxy_redirect off;
        proxy_set_header Host $host;
    }
}

server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    server_name ~^(?<subdomain>.+)\.testingcorna.test;

    access_log /dev/stdout log_with_timings;
    error_log stderr warn;

    location / {
        resolver 127.0.0.11;
        proxy_pass http://corna:5001/subdomain/$subdomain$request_uri;
        proxy_redirect off;
        proxy_set_header Host $host;
    }

    location ^~ /static/ {
        root /themes/;
        autoindex off;   
    }
}

server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    server_name testingcorna.test;

    access_log /dev/stdout log_with_timings;
    error_log stderr warn;

    # Proxying connections to application servers
    location / {
        # this is needed for nginx to resolve to the other containers
        # I think this is because the server name is localhost
        resolver 127.0.0.11;
        proxy_pass http://corna:5001/frontend$request_uri;
        proxy_redirect off;
        proxy_set_header Host $host;
    }

    location ^~ /static/ {
        add_header Access-Control-Allow-Origin $cors_header;
        root /www/;
        autoindex off;
    }

    location ^~ /images/ {
        add_header Access-Control-Allow-Origin $cors_header;
        root /www/;
        autoindex off;
    }
}
