[loggers]
keys=root, gunicorn.error

[handlers]
keys=journal

[formatters]
keys=generic

[logger_root]
level=INFO
handlers=journal

[logger_gunicorn.error]
level=INFO
handlers=journal
propagate=0
qualname=gunicorn.error

[handler_journal]
class=logging.StreamHandler
formatter=generic
args=()

[formatter_generic]
format=%(asctime)s - %(levelname)s - %(name)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
class=logging.Formatter
