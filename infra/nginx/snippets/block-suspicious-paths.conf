# Reject hidden files/directories at any path depth.
# Preserve /.well-known/ for standard discovery endpoints.
location ~ /\.(?!well-known(?:/|$)) {
    return 404;
}

# Corna does not serve PHP.
location ~* \.php(?:/|$) {
    return 404;
}

# Reject consecutive slashes in the URL path.
# Prevents Werkzeug from redirecting malformed URLs
# to internal Flask routes such as /frontend/ or /subdomain/.
if ($request_uri ~ "^[^?]*//") {
    return 404;
}
